services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/prensa_app?schema=public
      APP_BASE_URL: https://metapress.metasoc.es
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@10.15.1 --activate &&
      cd /workspace &&
      pnpm --filter @prensa-app/api exec prisma migrate deploy &&
      pnpm --filter @prensa-app/api exec prisma db seed &&
      cd /workspace/apps/api &&
      node dist/server.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: https://backend-metapress.metasoc.es
    ports:
      - "4173:4173"
    depends_on:
      - api

  worker:
    image: node:24-slim
    working_dir: /workspace
    environment:
      PNPM_HOME: /pnpm
      PNPM_STORE_DIR: /pnpm/store
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/prensa_app?schema=public
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@10.15.1 --activate &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @prensa-app/worker dev"
    volumes:
      - .:/workspace
      - pnpm-store-worker:/pnpm/store
      - worker-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: prensa_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prensa_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  pnpm-store-api:
  pnpm-store-web:
  pnpm-store-worker:
  worker-node-modules: