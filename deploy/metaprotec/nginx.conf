# =====================================================================
# nginx del contenedor `web` (deploy Metaprotec)
# ---------------------------------------------------------------------
# - Sirve los estáticos del SPA con fallback a index.html
# - Hace proxy interno de /api/* -> api:3001 (servicio del docker-compose)
# - Same-origin: el navegador ve un único origen -> NO hay CORS
# =====================================================================

# Tamaño máximo de subida (para PDFs / boletines / multipart de la app)
client_max_body_size 100M;

# Gzip básico para los estáticos
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------
    # API: proxy interno al contenedor `api` en la red docker-compose
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streaming / WebSockets si los hubiera en el futuro
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts generosos por si hay generación de PDF / scraping
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Buffers OFF para evitar problemas con SSE o respuestas largas
        proxy_buffering       off;
    }

    # ---------------------------------------------------------------
    # Cache agresivo para assets versionados de Vite (hash en el nombre)
    # ---------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------
    # SPA fallback: cualquier ruta no existente -> index.html
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck interno para Docker
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
